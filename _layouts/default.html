<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <script>
    // アプリから ?theme=dark を付けて開いた時だけダークモードにする(ブラウザで開いた時は明るいまま)
    if (/[?&]theme=dark(&|$)/.test(location.search)) document.documentElement.classList.add('dark');
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --sub: #59636e;
      --link: #0969da;
      --border: #d1d9e0;
    }
    html.dark {
      color-scheme: dark;
      --bg: #000000;
      --text: #e6e6e6;
      --sub: #a0a0a0;
      --link: #7ab7ff;
      --border: #333333;
    }
    html { background: var(--bg); }
    body {
      margin: 0 auto;
      max-width: 760px;
      padding: 16px 20px 48px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    h1 { font-size: 1.5em; line-height: 1.3; margin: 0.6em 0 0.4em; }
    h2 { font-size: 1.15em; margin: 1.8em 0 0.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
    p, ul { margin: 0.6em 0; }
    ul { padding-left: 1.4em; }
    li { margin: 0.3em 0; }
    a { color: var(--link); }
    hr { border: 0; border-top: 1px solid var(--border); margin: 2.5em 0; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  </style>
</head>
<body>
{{ content }}
</body>
</html>
